<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hudson SB Purdy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Bebas Neue', sans-serif;
    }

    /* ── Video background ── */
    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: 0;
      opacity: 0.55;
    }

    /* Dark vignette overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 30%,
        rgba(0,0,0,0.75) 100%);
      z-index: 1;
    }

    /* ── Main layout ── */
    #ui {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    /* ── Name at top ── */
    #name {
      margin-top: 3.5vh;
      letter-spacing: 0.35em;
      font-size: clamp(1rem, 3vw, 2rem);
      font-weight: 700;
      color: #b0c4c4;
      text-transform: uppercase;
      text-shadow:
        0 0 12px rgba(255,255,255,0.25),
        0 2px 6px rgba(0,0,0,0.8);
    }

    /* thin rule under name */
    #name::after {
      content: '';
      display: block;
      margin: 0.4em auto 0;
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(200,200,200,0.5), transparent);
    }

    /* ── Centre menu ── */
    #menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2vh;
    }

    .menu-btn {
      display: block;
      width: 260px;
      padding: 0.55em 0;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: clamp(0.85rem, 2vw, 1.25rem);
      font-weight: 700;
      color: #b0c4c4;
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      transition: color 0.18s, text-shadow 0.18s;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    /* bracket decoration on hover / active */
    .menu-btn::before,
    .menu-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 70%;
      border-color: transparent;
      border-style: solid;
      opacity: 0;
      transition: opacity 0.18s, border-color 0.18s;
    }
    .menu-btn::before {
      left: 12px;
      border-width: 2px 0 2px 2px;
    }
    .menu-btn::after {
      right: 12px;
      border-width: 2px 2px 2px 0;
    }

    .menu-btn:hover,
    .menu-btn:focus {
      color: #e87c20;
      text-shadow: 0 0 14px rgba(232, 124, 32, 0.7), 0 1px 4px rgba(0,0,0,0.9);
      outline: none;
    }
    .menu-btn:hover::before,
    .menu-btn:focus::before,
    .menu-btn:hover::after,
    .menu-btn:focus::after {
      opacity: 1;
      border-color: #e87c20;
    }

  </style>
</head>
<body>

  <!-- Background video — replace bg.mp4 with your uploaded video filename -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="videos/bg.mp4" type="video/mp4" />
  </video>

  <div id="overlay"></div>

  <div id="ui">
    <div id="name">Hudson Sterling Batavia Purdy</div>

    <nav id="menu">
      <a class="menu-btn" href="films.html">Films</a>
      <a class="menu-btn" href="code-projects.html">Code Projects</a>
      <a class="menu-btn" href="about.html">About</a>
    </nav>
  </div>


</body>
</html>
