<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>f1lm5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    :root {
      --orange: #e87c20;
      --text: #e8e8e8;
      --label: #9a9a9a;
      --line: rgba(255,255,255,0.08);
      --panel: rgba(18,18,18,0.82);
      --cell: rgba(255,255,255,0.035);
      --box: rgba(10,10,10,0.75);
      --box-edge: #3c3c3c;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      background: #000;
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      color: var(--text);
    }

    /* ── Video background ── */
    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: 0;
      opacity: 0.35;
    }

    /* Dark vignette overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.2) 30%,
        rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    /* ── Main layout ── */
    #ui {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0 16px 3vh;
    }

    /* ── Name at top ── */
    #name {
      margin-top: 3.5vh;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.35em;
      font-size: clamp(1rem, 3vw, 2rem);
      font-weight: 700;
      color: #e8e8e8;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      text-shadow:
        0 0 12px rgba(255,255,255,0.25),
        0 2px 6px rgba(0,0,0,0.8);
      transition: color 0.18s, text-shadow 0.18s;
      outline: none;
    }

    #name:hover,
    #name:focus {
      color: var(--orange);
      text-shadow: 0 0 14px rgba(232, 124, 32, 0.7), 0 1px 4px rgba(0,0,0,0.9);
    }

    #name span {
      position: relative;
    }

    #name span::before,
    #name span::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 70%;
      border-color: transparent;
      border-style: solid;
      opacity: 0;
      transition: opacity 0.18s, border-color 0.18s;
    }
    #name span::before {
      left: -18px;
      border-width: 2px 0 2px 2px;
    }
    #name span::after {
      right: -18px;
      border-width: 2px 2px 2px 0;
    }

    #name:hover span::before,
    #name:focus span::before,
    #name:hover span::after,
    #name:focus span::after {
      opacity: 1;
      border-color: var(--orange);
    }

    #name::after {
      content: '';
      display: block;
      margin: 0.4em auto 0;
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(200,200,200,0.5), transparent);
    }

    /* ══════════ Shared pieces ══════════ */
    .label {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--label);
    }

    /* placeholder boxes */
    .ph {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px dashed rgba(255,255,255,0.22);
      background:
        repeating-linear-gradient(45deg,
          rgba(255,255,255,0.025) 0 10px,
          transparent 10px 20px);
      color: #777;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .ph img,
    .ph video,
    .ph iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      display: block;
    }

    /* segmented progress bar */
    .bar {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
    }

    .bar .count {
      align-self: flex-end;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      line-height: 1;
      color: var(--orange);
    }

    .bar .segments {
      display: flex;
      gap: 4px;
    }

    .bar .segments i {
      flex: 1;
      height: 8px;
      background: #2d2d2d;
    }

    .bar .segments i.on {
      background: var(--orange);
    }

    @keyframes swap {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    /* ══════════ Film select screen ══════════ */
    #screen {
      width: 100%;
      max-width: 1100px;
      margin-top: 3vh;
    }

    #head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    #head h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: clamp(2.2rem, 4.5vw, 3.2rem);
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    #screen .bar .segments { margin: 8px 0 14px; }

    /* carousel bleeds past #screen to the window edges; the track slides
       so the selected card always lines up with the heading */
    #carousel {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      overflow: hidden;
    }

    #track {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      list-style: none;
      transition: transform 0.28s ease-out;
    }

    .card {
      flex: none;
      display: flex;
      flex-direction: column;
      width: 260px;
      height: 200px;
      margin-top: 22px;
      background: var(--box);
      border: 1px solid var(--box-edge);
      color: var(--text);
      text-decoration: none;
      outline: none;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
    }

    .card .ph {
      flex: 1;
      border: 0;
    }

    .card .card-name {
      padding: 4px 8px 5px;
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .card[aria-selected="true"] {
      width: 475px;
      height: 300px;
      margin-top: 0;
      border: 2px solid var(--orange);
      box-shadow: 0 0 18px rgba(232,124,32,0.18);
      animation: rise 0.2s ease-out;
    }

    .card[aria-selected="true"] .card-name { color: var(--orange); }

    /* description + stat bars under the carousel */
    #info {
      display: grid;
      grid-template-columns: 475px 1fr;
      gap: 16px 40px;
      margin-top: 16px;
      animation: swap 0.22s ease-out;
    }

    .dots {
      display: flex;
      gap: 10px;
      align-items: center;
      height: 12px;
      color: #555;
      font-size: 0.6rem;
    }

    .dots .on {
      color: var(--orange);
      font-size: 0.85rem;
    }

    .blurb {
      position: relative;
      margin-top: 10px;
      padding-left: 16px;
      font-size: 1.3rem;
      font-weight: 500;
      line-height: 1.4;
      color: #bbb;
    }

    .blurb::before {
      content: '\25B8';
      position: absolute;
      left: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: auto 1fr;
      align-content: start;
      align-items: center;
      gap: 4px 10px;
      padding-top: 22px;
    }

    .stats .k {
      min-width: 0;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .meter {
      display: flex;
      gap: 3px;
    }

    .meter i {
      width: 13px;
      height: 13px;
      border: 1px solid #555;
    }

    .meter i.on {
      background: #8a8a8a;
      border-color: #8a8a8a;
    }

    /* category list: ↑/↓ cycles */
    #cats {
      margin-top: 22px;
      list-style: none;
    }

    #cats button {
      all: unset;
      cursor: pointer;
      display: block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      line-height: 1.15;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    #cats button:hover,
    #cats button:focus-visible { color: #fff; }

    #cats .active button {
      font-size: clamp(2.6rem, 5vw, 3.6rem);
      line-height: 1;
      padding-bottom: 6px;
      margin-bottom: 8px;
      color: var(--orange);
      border-bottom: 1px solid var(--line);
      width: 475px;
      max-width: 100%;
    }

    /* list footer prompts */
    #foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 18px;
      font-size: 1.15rem;
      font-weight: 600;
    }

    #foot .group {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .tokens { color: var(--orange); }

    /* ══════════ Film detail screen ══════════ */
    #detail {
      width: 100%;
      max-width: 1100px;
      margin-top: 2vh;
      animation: rise 0.25s ease-out;
    }

    /* angled frame rails top & bottom */
    .rail {
      display: block;
      width: 100%;
      height: 14px;
      overflow: visible;
    }

    .rail polyline {
      fill: none;
      stroke: #4a4a4a;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .d-inner {
      padding: 10px 2%;
    }

    .d-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    .d-head h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      letter-spacing: 0.03em;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .d-head .count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      line-height: 1;
      color: var(--orange);
    }

    #detail .segments {
      display: flex;
      gap: 6px;
      margin: 10px 0 16px;
    }

    #detail .segments i {
      flex: 1;
      height: 8px;
      background: #2d2d2d;
    }

    #detail .segments i.on { background: var(--orange); }

    .d-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 14px 22px;
    }

    .d-left,
    .d-right {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .d-section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.06em;
      color: var(--label);
      line-height: 1;
    }

    /* primary: big orange-framed poster */
    .d-primary {
      position: relative;
      aspect-ratio: 16 / 7;
      border: 2px solid var(--orange);
      background: var(--box);
      box-shadow: 0 0 18px rgba(232,124,32,0.18);
    }

    .d-primary .ph {
      position: absolute;
      inset: 0;
      border: 0;
    }

    .d-primary .corner-label {
      position: absolute;
      top: 6px;
      left: 8px;
      z-index: 1;
    }


    .d-primary .film-name {
      position: absolute;
      left: 12px;
      bottom: 6px;
      z-index: 1;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.8rem, 3.4vw, 2.6rem);
      line-height: 1;
      color: var(--orange);
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* details row */
    .d-attach {
      padding: 0 8px;
    }

    .d-attach ul {
      list-style: none;
      margin-top: 6px;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .slots {
      display: flex;
      gap: 14px;
    }

    .slot {
      width: 84px;
      aspect-ratio: 1;
      background: var(--box);
      border: 1px solid var(--box-edge);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
    }

    .slot .ph {
      width: 100%;
      height: 100%;
      border: 0;
      font-size: 0.55rem;
    }

    /* secondary = trailer */
    .d-secondary {
      position: relative;
      background: var(--box);
      border: 1px solid var(--box-edge);
      padding: 6px 8px 8px;
    }

    .d-secondary .ph {
      aspect-ratio: 16 / 9;
      margin-top: 6px;
    }

    /* right column perk rows */
    .d-perk {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 6px 8px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.025));
    }

    .d-perk ul {
      list-style: none;
      margin-top: 4px;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.3;
    }

    /* cast / crew names under the row title */
    .d-perk li.name {
      font-size: 1.05rem;
      font-weight: 500;
      color: #c4c4c4;
    }

    /* keyboard prompts */
    .d-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 24px;
      margin-bottom: 10px;
      padding: 0 2%;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .d-controls .group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 20px;
    }

    .key {
      all: unset;
      cursor: pointer;
      color: var(--text);
      text-decoration: none;
    }

    .key b {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: 1.45rem;
      color: #e8a33a;
      margin-right: 4px;
    }

    .key:hover,
    .key:focus-visible { color: #fff; }

    /* ── Narrow screens: stack it ── */
    @media (max-width: 760px) {
      .card { width: 160px; height: 130px; margin-top: 16px; }
      .card[aria-selected="true"] { width: 270px; height: 190px; }
      .card .card-name { font-size: 1.15rem; }

      #info { grid-template-columns: 1fr; }
      .stats { padding-top: 0; }
      .meter i { width: 9px; height: 9px; }

      #cats .active button { width: 100%; }

      .d-grid { grid-template-columns: 1fr; }

      .d-primary { aspect-ratio: 16 / 9; }

      .slot { width: 64px; }
    }
  </style>
</head>
<body>

  <!-- Background video -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="videos/bg.mp4" type="video/mp4" />
  </video>

  <div id="overlay"></div>

  <div id="ui">
    <a id="name" href="index.html"><span>Hudson Sterling Batavia Purdy</span></a>

    <!-- ── Select view: ←/→ picks a film, ↑/↓ picks a category, click to open ── -->
    <main id="screen">
      <div class="bar">
        <div id="head">
          <h1>Choose Film</h1>
          <span class="count" data-count></span>
        </div>
        <div class="segments" data-segments></div>
      </div>

      <div id="carousel">
        <ul id="track" role="listbox" aria-label="Films"></ul>
      </div>

      <section id="info" aria-live="polite"></section>

      <ul id="cats" aria-label="Categories"></ul>

      <footer id="foot">
        <div class="group">
          <button class="key" id="select-btn"><b>ENTER</b>Select</button>
          <a class="key" href="index.html"><b>ESC</b>Back</a>
        </div>
        <div class="group">
          <span class="tokens" data-tokens></span>
          <button class="key" id="watch-btn"><b>X</b>Watch Film</button>
        </div>
      </footer>
    </main>

    <!-- ── Detail view (films.html#slug) ── -->
    <main id="detail" hidden></main>
  </div>

  <script>
    /*
     * ── Film data ──
     * To fill a placeholder, set its `src` to an image/video path
     * (e.g. "images/ender-poster.jpg" or "videos/ender-trailer.mp4").
     * A YouTube/Vimeo embed URL also works for `trailer`.
     *
     * Right-hand rows: Perk 1/2/3 = stills[0..2], Lethal = cast, Tactical = crew.
     *
     * Select screen: `category` picks its tab (one of TABS; ↑/↓ switches), `blurb` is the
     * line under the carousel, `stats` fill the bars (0–20, see STAT_LABELS).
     */
    const FILMS = [
      {
        slug: 'ender',
        category: 'Short Films',
        blurb: 'TBD — one or two lines about the film.',
        stats: [10, 10, 10, 10],
        name: 'Ender',
        director: 'TBD',
        runtime: 'TBD',
        genre: 'TBD',
        format: 'TBD',
        cast: ['TBD'],
        crew: ['TBD'],
        poster: '',
        trailer: '',
        stills: ['', '', ''],
      },
      {
        slug: 'lgbtar',
        category: 'Short Films',
        blurb: 'TBD — one or two lines about the film.',
        stats: [10, 10, 10, 10],
        name: 'Lonely Boy Goes To A Rave',
        director: 'TBD',
        runtime: 'TBD',
        genre: 'TBD',
        format: 'TBD',
        cast: ['TBD'],
        crew: ['TBD'],
        poster: '',
        trailer: '',
        stills: ['', '', ''],
      },
    ];

    const STAT_LABELS = ['Story', 'Visuals', 'Sound', 'Pacing'];
    const STAT_MAX = 20;

    const details = f => [
      ['Director', f.director],
      ['Runtime',  f.runtime],
      ['Genre',    f.genre],
      ['Format',   f.format],
    ];

    const perks = f => [
      { heading: 'Perk 1',   title: 'Still 1', src: f.stills[0] },
      { heading: 'Perk 2',   title: 'Still 2', src: f.stills[1] },
      { heading: 'Perk 3',   title: 'Still 3', src: f.stills[2] },
      { heading: 'Lethal',   title: 'Cast',    names: f.cast },
      { heading: 'Tactical', title: 'Crew',    names: f.crew },
    ];

    const detailItems = f =>
      details(f).map(([k, v]) => `<li><span class="k">${k}</span> ${v}</li>`).join('');

    const SLOTS = 10;
    const screen = document.getElementById('screen');
    const detail = document.getElementById('detail');
    const carousel = document.getElementById('carousel');
    const track = document.getElementById('track');
    const info = document.getElementById('info');
    const catList = document.getElementById('cats');
    let current = 0;

    // Render an image/video if a src is set, otherwise a labeled placeholder box
    function media(src, label) {
      if (!src) return `<div class="ph">${label}</div>`;
      if (/youtube\.com|youtu\.be|vimeo\.com/.test(src))
        return `<div class="ph"><iframe src="${src}" allowfullscreen title="${label}"></iframe></div>`;
      if (/\.(mp4|webm|mov)$/i.test(src))
        return `<div class="ph"><video src="${src}" controls playsinline></video></div>`;
      return `<div class="ph"><img src="${src}" alt="${label}"></div>`;
    }

    const segments = (n = FILMS.length) =>
      Array.from({ length: SLOTS }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');

    function retrigger(el) {
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = '';
    }

    /* ── Select view ── */
    // Tabs listed at the bottom, in order. A film shows under the tab matching its `category`.
    const TABS = ['Short Films', 'Other Projects'];
    let tab = 0;
    const inTab = t => FILMS.filter(f => f.category === TABS[t]);

    function renderSelect() {
      const films = inTab(tab);
      const f = FILMS[current];

      if (films.length) {
        track.innerHTML = films.map(g => `
          <li><a class="card" href="#${g.slug}" role="option" data-i="${FILMS.indexOf(g)}"
                 aria-selected="${g === f}">
            ${media(g.poster, 'Poster')}
            <span class="card-name">${g.name}</span>
          </a></li>
        `).join('');
        track.querySelectorAll('.card').forEach(a =>
          a.addEventListener('focus', () => {
            // keyboard Tab only — re-rendering on a mouse focus would swallow the click
            if (a.matches(':focus-visible')) select(+a.dataset.i);
          }));

        info.innerHTML = `
          <div>
            <div class="dots">${films.map(g => `<span class="${g === f ? 'on' : ''}">&#9670;</span>`).join('')}</div>
            <p class="blurb">${f.blurb}</p>
          </div>
        `;
        // Stat bars — paused for now. Uncomment to bring them back.
        // info.innerHTML += `
        //   <div class="stats">
        //     ${STAT_LABELS.map((label, s) => `
        //       <span class="k">${label}</span>
        //       <span class="meter">${Array.from({ length: STAT_MAX }, (_, n) =>
        //         `<i class="${n < f.stats[s] ? 'on' : ''}"></i>`).join('')}</span>
        //     `).join('')}
        //   </div>
        // `;
      } else {
        track.innerHTML = `
          <li><div class="card" aria-selected="true">
            <div class="ph">Coming Soon</div>
            <span class="card-name">Coming Soon</span>
          </div></li>
        `;
        info.innerHTML = `<div><p class="blurb">Nothing here yet.</p></div>`;
      }
      retrigger(info);

      // Count/bar follow the open tab; an empty tab counts its "Coming Soon" card as 1
      const used = Math.max(films.length, 1);
      document.querySelector('[data-count]').textContent = `${used}/${SLOTS}`;
      document.querySelector('[data-segments]').innerHTML = segments(used);
      document.querySelector('[data-tokens]').textContent = `${SLOTS - used} Open Slots`;

      catList.innerHTML = TABS.map((c, t) =>
        `<li class="${t === tab ? 'active' : ''}"><button data-tab="${t}">${c}</button></li>`).join('');
      catList.querySelectorAll('button').forEach(b =>
        b.addEventListener('click', () => selectTab(+b.dataset.tab)));

      align();
    }

    // Slide the track so the selected card lines up with the heading
    function align() {
      const card = track.querySelector('[aria-selected="true"]');
      if (!card) return;
      const anchor = screen.getBoundingClientRect().left - carousel.getBoundingClientRect().left;
      track.style.transform = `translateX(${anchor - card.parentElement.offsetLeft}px)`;
    }

    function select(i) {
      if (i === current && track.innerHTML) return;
      current = i;
      renderSelect();
    }

    // Switch tabs, landing on the tab's first film (if it has any)
    function selectTab(t) {
      tab = (t + TABS.length) % TABS.length;
      const films = inTab(tab);
      if (films.length) current = FILMS.indexOf(films[0]);
      renderSelect();
    }

    // Step within the current tab (←/→)
    function stepFilm(d) {
      const films = inTab(tab);
      if (!films.length) return;
      const n = (films.indexOf(FILMS[current]) + d + films.length) % films.length;
      select(FILMS.indexOf(films[n]));
    }

    // Open the selected film, unless the current tab is empty
    function openSelected() {
      if (inTab(tab).length) openFilm(current);
    }

    /* ── Detail view ── */
    const slot = (src, label) => `<div class="slot">${media(src, label)}</div>`;

    function renderDetail() {
      const f = FILMS[current];
      document.title = `${f.name} — f1lm5`;
      detail.innerHTML = `
        <div class="d-controls">
          <div class="group">
            <a class="key" href="#"><b>ESC</b>Back</a>
            <button class="key" data-step="-1"><b>Q</b>Prev Film</button>
            <button class="key" data-step="1"><b>E</b>Next Film</button>
          </div>
          <div class="group">
            <span class="tokens">${SLOTS - FILMS.length} Open Slots</span>
            <button class="key" data-watch><b>X</b>Watch Film</button>
          </div>
        </div>

        <svg class="rail" viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true">
          <polyline points="0,13 1.5,13 2.5,1 97.5,1 98.5,13 100,13" />
        </svg>

        <div class="d-inner">
          <div class="d-head">
            <h1>${f.name}</h1>
            <span class="count">${current + 1}/${FILMS.length}</span>
          </div>
          <div class="segments">${segments()}</div>

          <div class="d-grid">
            <div class="d-left">
              <div class="d-primary">
                ${media(f.poster, 'Poster / Key Still')}
                <span class="label corner-label">Primary</span>
                <span class="film-name">${f.name}</span>
              </div>

              <div class="d-attach">
                <div class="d-section-label">Details</div>
                <ul>${detailItems(f)}</ul>
              </div>

              <div class="d-secondary" id="trailer">
                <div class="d-section-label">Secondary</div>
                ${media(f.trailer, 'Trailer / Film Video')}
              </div>
            </div>

            <div class="d-right">
              ${perks(f).map(p => `
                <div class="d-perk">
                  <div>
                    <div class="d-section-label">${p.heading}</div>
                    <ul>${p.names
                      ? `<li>${p.title}</li>${p.names.map(n => `<li class="name">${n}</li>`).join('')}`
                      : `<li>${p.title}</li>`}</ul>
                  </div>
                  ${p.names ? '' : `<div class="slots">${slot(p.src, 'Image')}</div>`}
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <svg class="rail" viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true">
          <polyline points="0,1 1.5,1 2.5,13 97.5,13 98.5,1 100,1" />
        </svg>
      `;

      detail.querySelectorAll('[data-step]').forEach(b =>
        b.addEventListener('click', () => openFilm(current + +b.dataset.step)));
      detail.querySelector('[data-watch]').addEventListener('click', watch);
      retrigger(detail);
    }

    function openFilm(i) {
      i = (i + FILMS.length) % FILMS.length;
      location.hash = FILMS[i].slug;
    }

    function watch() {
      document.getElementById('trailer').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    /* ── Routing: films.html shows the list, films.html#slug shows a film ── */
    function route() {
      const i = FILMS.findIndex(f => f.slug === location.hash.slice(1));
      if (i === -1) {
        detail.hidden = true;
        screen.hidden = false;
        document.title = 'f1lm5';
        renderSelect();
      } else {
        current = i;
        tab = TABS.indexOf(FILMS[i].category);
        screen.hidden = true;
        detail.hidden = false;
        renderDetail();
        window.scrollTo(0, 0);
      }
    }

    // Keyboard: select = ←/→ film, ↑/↓ category, Enter open, Esc home. Detail = Q/E or ←/→ switch, Esc back.
    document.addEventListener('keydown', e => {
      const inDetail = !detail.hidden;
      const k = e.key;
      if (inDetail) {
        if (k === 'Escape' || k === 'Backspace') location.hash = '';
        if (['q', 'Q', 'ArrowLeft'].includes(k))  openFilm(current - 1);
        if (['e', 'E', 'ArrowRight'].includes(k)) openFilm(current + 1);
        if (k === 'x' || k === 'X') watch();
      } else {
        if (['ArrowRight', 'd', 'D'].includes(k)) { e.preventDefault(); stepFilm(1); }
        if (['ArrowLeft', 'a', 'A'].includes(k))  { e.preventDefault(); stepFilm(-1); }
        if (['ArrowDown', 's', 'S'].includes(k))  { e.preventDefault(); selectTab(tab + 1); }
        if (['ArrowUp', 'w', 'W'].includes(k))    { e.preventDefault(); selectTab(tab - 1); }
        if (k === 'Enter' && !e.target.closest('a, button')) openSelected();
        if (k === 'x' || k === 'X') openSelected();
        if (k === 'Escape' || k === 'Backspace') location.href = 'index.html';
      }
    });

    document.getElementById('select-btn').addEventListener('click', openSelected);
    document.getElementById('watch-btn').addEventListener('click', openSelected);


    window.addEventListener('hashchange', route);
    window.addEventListener('resize', align);
    route();
  </script>

</body>
</html>
