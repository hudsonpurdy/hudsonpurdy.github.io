<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>f1lm5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Bebas Neue', sans-serif;
    }

    /* ── Video background ── */
    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: 0;
      opacity: 0.55;
    }

    /* Dark vignette overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 30%,
        rgba(0,0,0,0.75) 100%);
      z-index: 1;
    }

    /* ── Main layout ── */
    #ui {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    /* ── Name at top ── */
    #name {
      margin-top: 3.5vh;
      letter-spacing: 0.35em;
      font-size: clamp(1rem, 3vw, 2rem);
      font-weight: 700;
      color: #e8e8e8;
      text-transform: uppercase;
      text-decoration: none;
      text-shadow:
        0 0 12px rgba(255,255,255,0.25),
        0 2px 6px rgba(0,0,0,0.8);
      transition: color 0.18s, text-shadow 0.18s;
      outline: none;
    }

    #name:hover,
    #name:focus {
      color: #e87c20;
      text-shadow: 0 0 14px rgba(232, 124, 32, 0.7), 0 1px 4px rgba(0,0,0,0.9);
    }

    #name span {
      position: relative;
    }

    #name span::before,
    #name span::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 70%;
      border-color: transparent;
      border-style: solid;
      opacity: 0;
      transition: opacity 0.18s, border-color 0.18s;
    }
    #name span::before {
      left: -18px;
      border-width: 2px 0 2px 2px;
    }
    #name span::after {
      right: -18px;
      border-width: 2px 2px 2px 0;
    }

    #name:hover span::before,
    #name:focus span::before,
    #name:hover span::after,
    #name:focus span::after {
      opacity: 1;
      border-color: #e87c20;
    }

    /* thin rule under name */
    #name::after {
      content: '';
      display: block;
      margin: 0.4em auto 0;
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(200,200,200,0.5), transparent);
    }

    /* ── Centre content ── */
    #content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #content p {
      color: #b0c4c4;
      letter-spacing: 0.3em;
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <!-- Background video — replace bg.mp4 with your uploaded video filename -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="videos/bg.mp4" type="video/mp4" />
  </video>

  <div id="overlay"></div>

  <div id="ui">
    <a id="name" href="index.html"><span>Hudson Sterling Batavia Purdy</span></a>
    <div id="content">
      <p>MORE COMING SOON</p>
    </div>
  </div>


</body>
</html>
